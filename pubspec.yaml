name: imagestore
description: Face-aware memory assistant — PersonaLens Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase auth
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.2.0

  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # Image picking
  image_picker: ^1.1.2

  # Google Fonts (Syne + DM Mono)
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Camera and media
  camera: ^0.11.0+2
  record: ^6.2.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
